<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Appointment Finder</title>
</head>
<body>

<main class="container mt-5">
    <!--  Make back button always be in top left corner with position fixed -->
    <button id="back-button" class="btn btn-primary position-fixed"
            style="top: 15px; left: 15px; z-index: 999; display: none">Back
    </button>
    <h1 class="text-center mb-5">Appointment Finder</h1>
    <!--  Container for all appointments -->
    <div id="appointments-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
    <!--    Container for single appointment -->
    <div id="appointment-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" style="display: none"></div>

</main>

<!-- Axios -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<!-- Bootstrap JavaScript Libraries -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.6.4.min.js"
        integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8=" crossorigin="anonymous"></script>

<!-- Custom JavaScript -->
<script src="js/script.mjs" type="module"></script>

</body>
</html>
